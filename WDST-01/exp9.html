<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resposive Product Grid</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            padding: 10px;
            width: 100%;
        }

        main {
            display: grid;
            width: 100%;
            grid-template-columns: auto;
            column-gap: 20px;
            row-gap: 20px;
            margin: auto;
            border: 1px solid black;
            border-radius: 2px;
        }

        .header {
            font-size: large;
            text-transform: uppercase;
            grid-column-start: 1;
            grid-column-end: 3;
            padding-left: 20px;
        }

        .nav {
            grid-column-start: 1;
            grid-column-end: 3;
            padding: 20px;
            display: grid;
            grid-template-columns: auto auto auto auto auto auto;
            background-color: black;
            color: white;
        }

        .content {
            display: grid;
            grid-template-columns: auto auto auto auto auto;
            column-gap: 10px;
            grid-column-start: 1;
            grid-column-end: 3;
        }

        .l1 {
            padding-left: 20px;
            grid-column-start: 1;
            grid-column-end: 2;
        }

        div.l1 p {
            display: inline;
        }

        div.l1 h2 {
            border-top: 1px solid black;
            font-size: 15px;
        }

        div.l1 h1 {
            font-size: 20px;
        }

        .l2 {
            grid-column-start: 2;
            grid-column-end: 6;
            display: grid;
            grid-template-columns: auto auto auto;
            column-gap: 5px;
            padding-bottom: 10px;
            text-align: center;
        }

        img {
            width: 300px;
            height: 300px;
        }

        button {
            background-color: lightgray;
        }

        .box {
            border: 1px solid black;
            border-radius: 2px;
            padding-bottom: 20px;
        }

        div.nav div {
            text-align: center;
        }

        div.nav div:hover {
            border-bottom: 2px solid white;
        }

        @media (max-width: 1024px) {
            .l2 {
                grid-template-columns: auto auto;
            }

            img {
                width: 250px;
                height: 250px;
            }
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            .l1 {
                grid-column-start: 1;
                grid-column-end: 3;
            }

            .l2 {
                grid-column-start: 1;
                grid-column-end: 3;
                grid-template-columns: auto auto;
            }

            img {
                width: 200px;
                height: 200px;
            }
        }

        @media (max-width: 480px) {
            .nav {
                grid-template-columns: auto auto;
                row-gap: 10px;
            }

            .l2 {
                grid-template-columns: auto;
            }

            img {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="header">
            <h1>responsive product grid</h1>
        </div>
        <div class="nav">
            <div><img src="images.jpeg"
                    alt="" style="width: 30px; height:30px"></div>
            <div>Home</div>
            <div>Products</div>
            <div><input type="search" placeholder="Search for products"></div>
            <div>Login</div>
            <div>Cart</div>
        </div>
        <div class="content">
            <div class="l1">
                <h1>Filters</h1>
                <h2>Category</h2>
                <input type="checkbox">
                <p>Prices</p>
            </div>
            <div class="l2">
                <div class="box">
                    <img src="shopping.webp" alt="cruppted">
                    <h4>Vitamin C Face Serum</h4>
                    <p>&#8377;699</p>
                    <button>Add To Cart</button>
                </div>
                <div class="box">
                    <img src="31oWgobSUAL._SR290,290_AC_.jpg" alt="cruppted">
                    <h4>Cleanser</h4>
                    <p>&#8377;599</p>
                    <button>Add To Cart</button>
                </div>
                <div class="box">
                    <img src="8_Benefits_of_Using_Face_Toner_in_Your_Skincare_Routine_97899cff-0758-4618-bde6-c60af1a6834a.webp" alt="cruppted">
                    <h4>Toner</h4>
                    <p>&#8377;499</p>
                    <button>Add To Cart</button>
                </div>
            </div>
            <div class="l2">
                <div class="box">
                    <img src="oil-free-moisturizer_3.jpg" alt="crupppted">
                    <h4>Moisturiser</h4>
                    <p>&#8377;899</p>
                    <button>Add To Cart</button>
                </div>
                <div class="box">
                    <img src="Deep_Moisturising_Body_Lotion.webp" alt="cruppted">
                    <h4>Lotion</h4>
                    <p>&#8377;599</p>
                    <button>Add To Cart</button>
                </div>
                <div class="box">
                    <img src="50003800-DOM07FRMNaturalsbrighteningpeel-offmask_0.33floz_Front.webp" alt="cruppted">
                    <h4>Face Mask</h4>
                    <p>&#8377;500</p>
                    <button>Add To Cart</button>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
