<html>
<head>
<title>Student Form</title>
</head>
<style>
form{
background-color: white;
padding:55px;

}

padding: 12px 20px;

font-size: 18px;
width: 100%;

}
label{
font-size: 1.1em;

color: #007bff;

<body>

<form action="">
<fieldset>
<label form="">Candidate
Name</label>

<label
form="">Course</label>
<select>

</select><br><br>
<label
form="">Branch</label>

</fieldset>
<fieldset>

<input type="date" name="" id=""><br><br>

<input type="tel" name="" id="" placeholder="Mobile No.">
